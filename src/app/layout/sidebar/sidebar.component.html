<div class="h-full flex flex-col bg-slate-900 text-slate-100">
  <div class="px-4 py-5 border-b border-slate-700 flex items-center gap-2">
    <mat-icon class="text-blue-400">bolt</mat-icon>
    <span class="font-semibold text-lg">Instelec</span>
  </div>

  <mat-nav-list class="flex-1 py-2">
    @for (item of visibleItems(); track item.route) {
      <a
        mat-list-item
        [routerLink]="item.route"
        routerLinkActive="bg-slate-800 text-blue-300"
        [routerLinkActiveOptions]="{ exact: false }"
        (click)="onClick()"
        class="text-slate-200"
      >
        <mat-icon matListItemIcon class="text-slate-300">{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    }
  </mat-nav-list>

  <mat-divider class="border-slate-700"></mat-divider>
  <div class="p-3 text-xs text-slate-400">v0.1.0</div>
</div>
