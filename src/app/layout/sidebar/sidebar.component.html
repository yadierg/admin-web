<div class="h-full flex flex-col bg-sidebar-bg text-slate-300">
  <!-- Logo -->
  <div class="h-16 flex items-center px-5 border-b border-slate-700">
    <img
      src="assets/logo-brand-white.svg"
      alt="Instelec"
      class="h-7 w-auto"
      onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
    />
    <div class="hidden items-center gap-2" style="display: none;">
      <div class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">
        IE
      </div>
      <span class="font-semibold text-lg tracking-wide" style="color: #EDEDED;">INSTELEC</span>
    </div>
  </div>

  <!-- Nav -->
  <mat-nav-list class="flex-1 py-3 px-2">
    @for (item of visibleItems(); track item.route) {
      <a
        mat-list-item
        [routerLink]="item.route"
        routerLinkActive="sidebar-active"
        [routerLinkActiveOptions]="{ exact: false }"
        (click)="onClick()"
        class="sidebar-item"
      >
        <mat-icon matListItemIcon class="text-slate-400">{{ item.icon }}</mat-icon>
        <span matListItemTitle class="text-sm">{{ item.label }}</span>
      </a>
    }
  </mat-nav-list>

  <!-- Footer -->
  <div class="px-5 py-3 border-t border-slate-700 text-xs text-slate-500">
    v0.1.0 · Instelec
  </div>
</div>
