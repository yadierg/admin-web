<mat-toolbar class="!bg-white !text-slate-800 border-b border-slate-200 shadow-sm flex items-center">
  <!-- Botón hamburguesa -->
  <button
    mat-icon-button
    (click)="onToggleSidenav()"
    matTooltip="Mostrar/ocultar menú"
    class="mr-2"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <span class="font-medium">Admin</span>
  <span class="flex-1"></span>

  <button mat-button [matMenuTriggerFor]="userMenu" class="!h-auto !py-1">
    <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-semibold mr-2">
      {{ initials() }}
    </div>
    <div class="text-left leading-tight hidden sm:block">
      <div class="text-sm font-medium">{{ userName() }}</div>
      <div class="text-xs text-slate-500">{{ userEmail() }}</div>
    </div>
  </button>

  <mat-menu #userMenu="matMenu" xPosition="before">
    <button mat-menu-item disabled>
      <span class="text-xs text-slate-500">{{ userEmail() }}</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>
</mat-toolbar>
