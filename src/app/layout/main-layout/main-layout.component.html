<div class="flex flex-col h-screen">
  <app-header />

  <mat-sidenav-container class="flex-1 !bg-slate-100">
    <mat-sidenav
      [opened]="sidenavOpened()"
      [mode]="sidenavMode()"
      class="w-64 !bg-slate-900"
    >
      <app-sidebar (itemClicked)="onSidebarItemClicked()" />
    </mat-sidenav>

    <mat-sidenav-content class="!p-0">
      <div class="p-6">
        <router-outlet />
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
